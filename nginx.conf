server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # сжатие текстовых ответов
  gzip on;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_vary on;

  # ассеты vite собраны с хэшем в имени — кэшируем агрессивно
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # фото/видео/резюме из public/ — кэш на день
  location ~* \.(jpg|jpeg|png|webp|svg|mp4|pdf)$ {
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # SPA-фолбэк: любые пути ведут на index.html (кэш его не держим)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
